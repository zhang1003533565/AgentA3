<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>教务账号设置页面设计图</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eaf3fb;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #172b49;
    }

    .canvas {
      width: 480px;
      height: 924px;
      padding-top: 20px;
      background: #eaf3fb;
    }

    .phone {
      width: 392px;
      height: 844px;
      margin-left: 44px;
      overflow: hidden;
      border: 1px solid #bdd5e9;
      border-radius: 14px 14px 0 0;
      background: linear-gradient(180deg, #eaf7ff 0%, #f6fbff 52%, #f5f8fb 100%);
      box-shadow: 0 18px 40px rgba(84, 115, 153, 0.14);
    }

    .nav {
      height: 78px;
      display: grid;
      grid-template-columns: 70px 1fr 70px;
      align-items: center;
      padding: 0 18px;
    }

    .back {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      font-size: 32px;
      line-height: 1;
      color: #111827;
    }

    .title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: #111827;
    }

    .content {
      padding: 0 12px 28px;
    }

    .card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 12px;
      box-shadow: 0 14px 32px rgba(65, 102, 153, 0.08);
    }

    .account-card {
      padding: 18px 16px 16px;
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .section-title {
      display: block;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 800;
      color: #162a48;
    }

    .section-desc {
      display: block;
      margin-top: 7px;
      font-size: 12px;
      line-height: 1.2;
      color: #6a83a1;
    }

    .status {
      padding: 8px 12px;
      border-radius: 999px;
      background: #eaf8f3;
      color: #168b6a;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .state-line {
      height: 34px;
      margin-top: 16px;
      padding: 0 12px;
      border-radius: 8px;
      background: #ecfaf5;
      color: #168b6a;
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
    }

    .field {
      margin-top: 16px;
    }

    .label {
      display: block;
      margin-bottom: 9px;
      font-size: 12px;
      font-weight: 600;
      color: #405c7e;
    }

    .input-box {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border: 1px solid #d7e8fb;
      border-radius: 9px;
      background: #f7fbff;
      color: #172b49;
      font-size: 15px;
      letter-spacing: 0;
    }

    .password {
      letter-spacing: 2px;
      font-weight: 800;
    }

    .show-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      color: #3f7df2;
      font-weight: 600;
    }

    .tips-card {
      margin-top: 12px;
      padding: 18px 16px;
    }

    .tip-line {
      display: block;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.55;
      color: #516b88;
    }

    .save-btn {
      height: 48px;
      margin-top: 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #3f7df2, #23b08a);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 18px 32px rgba(63, 125, 242, 0.18);
    }
  </style>
</head>
<body>
  <main class="canvas">
    <section class="phone">
      <header class="nav">
        <div class="back">‹</div>
        <div class="title">教务账号设置</div>
        <div></div>
      </header>

      <div class="content">
        <section class="card account-card">
          <div class="head">
            <div>
              <span class="section-title">教务账号</span>
              <span class="section-desc">用于从教务系统导入课表，不影响学期列表</span>
            </div>
            <span class="status">已设置</span>
          </div>

          <div class="state-line">账号已保存，可以返回导入课表</div>

          <div class="field">
            <span class="label">教务系统学号</span>
            <div class="input-box">20203090128</div>
          </div>

          <div class="field">
            <span class="label">教务系统密码</span>
            <div class="input-box password">••••••••••</div>
            <span class="show-link">显示</span>
          </div>
        </section>

        <section class="card tips-card">
          <span class="section-title">说明</span>
          <span class="tip-line">账号只用于登录教务系统抓取课表。</span>
          <span class="tip-line">学年、学期和开学日期请在学期管理中维护。</span>
        </section>

        <div class="save-btn">保存账号</div>
      </div>
    </section>
  </main>
</body>
</html>
