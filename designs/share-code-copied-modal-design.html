<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>本学期分享码复制弹窗设计图</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eaf3fb;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #172b49;
    }

    .canvas {
      width: 390px;
      height: 844px;
      background: #eaf3fb;
      position: relative;
      overflow: hidden;
    }

    .phone {
      position: absolute;
      inset: 0;
      background: #eef7ff;
      overflow: hidden;
    }

    .nav {
      height: 84px;
      display: grid;
      grid-template-columns: 60px 1fr 60px;
      align-items: center;
      padding: 0 16px;
      background: rgba(239, 248, 255, 0.96);
    }

    .back {
      font-size: 32px;
      color: #111827;
      line-height: 1;
    }

    .title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: #111827;
    }

    .top {
      height: 64px;
      padding: 8px 30px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border-top: 1px solid rgba(190, 213, 233, 0.5);
      background: #edf7ff;
    }

    .week {
      display: block;
      color: #c03f32;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
    }

    .semester {
      display: block;
      margin-top: 5px;
      color: #73869c;
      font-size: 11px;
    }

    .actions {
      display: flex;
      gap: 8px;
      padding-top: 4px;
    }

    .chip,
    .plus {
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
    }

    .chip {
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.78);
      color: #1d1d1f;
    }

    .plus {
      width: 32px;
      background: #1d1d1f;
      color: #fff;
      font-size: 22px;
    }

    .weekdays {
      height: 36px;
      display: grid;
      grid-template-columns: 48px repeat(7, 1fr);
      align-items: center;
      padding: 0 18px;
      background: #f6fbff;
      color: #6c7d92;
      font-size: 12px;
      border-top: 1px solid rgba(190, 213, 233, 0.45);
      border-bottom: 1px solid rgba(190, 213, 233, 0.45);
    }

    .board {
      position: relative;
      height: 560px;
      margin: 0 18px;
      display: grid;
      grid-template-columns: 42px 1fr;
      background: #f7fbff;
      overflow: hidden;
    }

    .periods {
      padding-top: 10px;
      color: #6d7d90;
      font-size: 10px;
    }

    .period {
      height: 72px;
      text-align: center;
      border-bottom: 1px solid rgba(190, 213, 233, 0.6);
    }

    .period strong {
      display: block;
      color: #26364d;
      font-size: 16px;
      line-height: 1.2;
    }

    .grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      padding-top: 10px;
    }

    .course {
      height: 70px;
      border-radius: 7px;
      background: #dfe8f2;
      color: #50647c;
      font-size: 10px;
      line-height: 1.3;
      padding: 20px 6px 0;
      text-align: center;
      font-weight: 700;
    }

    .course.tall {
      height: 142px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(1px);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .modal {
      width: 312px;
      overflow: hidden;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.24);
    }

    .modal-body {
      padding: 26px 24px 20px;
      text-align: center;
    }

    .success {
      width: 42px;
      height: 42px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #eaf8f3;
      color: #168b6a;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 900;
    }

    .modal-title {
      display: block;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 900;
      color: #111827;
    }

    .info-box {
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 9px;
      background: #f7fbff;
      border: 1px solid #e2edf8;
      text-align: left;
    }

    .row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 4px;
      font-size: 14px;
      line-height: 1.55;
    }

    .row + .row {
      margin-top: 5px;
    }

    .label {
      color: #8b95a3;
      font-weight: 700;
    }

    .value {
      color: #5f6875;
      font-weight: 800;
      word-break: break-all;
    }

    .note {
      display: block;
      margin-top: 16px;
      color: #8a8f99;
      font-size: 15px;
      line-height: 1.55;
    }

    .modal-action {
      height: 48px;
      display: grid;
      place-items: center;
      border-top: 1px solid #edf0f3;
      color: #1677ff;
      font-size: 17px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <section class="phone">
      <header class="nav">
        <div class="back">‹</div>
        <div class="title">我的课表</div>
        <div></div>
      </header>

      <section class="top">
        <div>
          <span class="week">第18周</span>
          <span class="semester">2025-2026 第 2 学期　切换</span>
        </div>
        <div class="actions">
          <span class="chip">学期</span>
          <span class="chip">设置</span>
          <span class="chip">分享</span>
          <span class="plus">+</span>
        </div>
      </section>

      <section class="weekdays">
        <span>6月</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </section>

      <section class="board">
        <div class="periods">
          <div class="period"><strong>1</strong>08:00</div>
          <div class="period"><strong>2</strong>08:55</div>
          <div class="period"><strong>3</strong>10:00</div>
          <div class="period"><strong>4</strong>10:55</div>
          <div class="period"><strong>5</strong>14:30</div>
          <div class="period"><strong>6</strong>15:25</div>
        </div>
        <div class="grid">
          <div class="course">软件项目<br>开发A</div>
          <div class="course">网络编程<br>@明德楼</div>
          <div class="course">Python<br>程序设计</div>
          <div class="course">国家安全<br>教育</div>
          <div class="course">软件项目<br>开发A</div>
          <div class="course">网络编程</div>
          <div></div>
          <div class="course tall">深度学习<br>@图书馆</div>
          <div class="course tall">软件项目<br>开发A</div>
          <div class="course tall">软件项目<br>开发A</div>
          <div class="course tall">软件项目<br>开发A</div>
          <div class="course tall">软件工程<br>@明德楼</div>
          <div class="course tall">网络编程<br>@图书馆</div>
        </div>
      </section>
    </section>

    <section class="overlay">
      <div class="modal">
        <div class="modal-body">
          <div class="success">✓</div>
          <span class="modal-title">本学期分享码已复制</span>
          <div class="info-box">
            <div class="row">
              <span class="label">分享学期</span>
              <span class="value">2025-2026 第 2 学期</span>
            </div>
            <div class="row">
              <span class="label">分享码</span>
              <span class="value">SCHTEST102#2025-2026#2</span>
            </div>
          </div>
          <span class="note">好友粘贴后只会导入这个学期的课表。</span>
        </div>
        <div class="modal-action">我知道了</div>
      </div>
    </section>
  </main>
</body>
</html>
