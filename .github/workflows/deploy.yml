name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality:
    uses: ./.github/workflows/quality-gate.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build And Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./AppBackend
          file: ./AppBackend/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/lukezhang/appbackend:${{ github.sha }}

      - name: Build And Push Web
        uses: docker/build-push-action@v6
        with:
          context: ./AppWeb
          file: ./AppWeb/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/lukezhang/appweb:${{ github.sha }}

      - name: Build And Push AI Server
        uses: docker/build-push-action@v6
        with:
          context: ./ai-servers
          file: ./ai-servers/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/lukezhang/ai-server:${{ github.sha }}

      - name: Deploy On Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            export REPO_DIR="${{ secrets.DEPLOY_PATH }}"
            export DEPLOY_BRANCH="${{ github.ref_name }}"
            export IMAGE_TAG="${{ github.sha }}"
            cd "$REPO_DIR"
            docker login --username="${{ secrets.ACR_USERNAME }}" --password="${{ secrets.ACR_PASSWORD }}" "${{ secrets.ACR_REGISTRY }}"
            chmod +x AppBackend/deploy/deploy-on-server.sh
            ./AppBackend/deploy/deploy-on-server.sh
