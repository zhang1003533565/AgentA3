name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality:
    uses: ./.github/workflows/quality-gate.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE || format('{0}/lukezhang/appbackend', secrets.ACR_REGISTRY) }}
      WEB_IMAGE: ${{ vars.WEB_IMAGE || format('{0}/lukezhang/appweb', secrets.ACR_REGISTRY) }}
      AI_SERVER_IMAGE: ${{ vars.AI_SERVER_IMAGE || format('{0}/lukezhang/ai-server', secrets.ACR_REGISTRY) }}
      IMAGE_TAG: ${{ github.sha }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AI_INTERNAL_TOKEN: ${{ secrets.AI_INTERNAL_TOKEN }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
      REPO_DIR: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_BRANCH: ${{ github.ref_name }}
      DEPLOY_PRUNE_DOCKER: ${{ vars.DEPLOY_PRUNE_DOCKER || 'true' }}
      DEPLOY_PRUNE_UNTIL: ${{ vars.DEPLOY_PRUNE_UNTIL || '24h' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build And Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./AppBackend
          file: ./AppBackend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build And Push Web
        uses: docker/build-push-action@v6
        with:
          context: ./AppWeb
          file: ./AppWeb/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build And Push AI Server
        uses: docker/build-push-action@v6
        with:
          context: ./ai-servers
          file: ./ai-servers/Dockerfile
          push: true
          tags: ${{ env.AI_SERVER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Deploy On Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD,BACKEND_IMAGE,WEB_IMAGE,AI_SERVER_IMAGE,IMAGE_TAG,JWT_SECRET,AI_INTERNAL_TOKEN,MYSQL_ROOT_PASSWORD,SMOKE_TOKEN,REPO_DIR,DEPLOY_BRANCH,DEPLOY_PRUNE_DOCKER,DEPLOY_PRUNE_UNTIL
          script: |
            cd "$REPO_DIR"
            printf '%s' "$ACR_PASSWORD" | docker login --username="$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
            chmod +x AppBackend/deploy/deploy-on-server.sh
            ./AppBackend/deploy/deploy-on-server.sh
