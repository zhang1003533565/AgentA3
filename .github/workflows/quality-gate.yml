name: Quality Gate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-servers/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: AppWeb/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m venv ai-servers/.venv
          ai-servers/.venv/bin/python -m pip install --upgrade pip==25.1.1
          ai-servers/.venv/bin/python -m pip install -r ai-servers/requirements.txt pytest==8.3.5

      - name: Install AppWeb dependencies
        working-directory: AppWeb
        run: npm ci

      - name: Run repository quality gate
        run: bash scripts/ci/quality-gate.sh

      - name: Build SHA-tagged submission images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose --env-file deploy/.env.example -f deploy/compose.submission.yml build
