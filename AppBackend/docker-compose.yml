name: smart-campus

services:
  adminer:
    container_name: smart-campus-adminer
    image: docker.m.daocloud.io/library/adminer:latest
    restart: always
    ports:
      - "${ADMINER_PORT:-7070}:8080"

  mysql:
    container_name: smart-campus-mysql
    image: docker.m.daocloud.io/library/mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-smart-campus}"
    command:
      - --character-set-server=${MYSQL_CHARSET:-utf8mb4}
      - --collation-server=${MYSQL_COLLATION:-utf8mb4_unicode_ci}
    ports:
      - "3306:3306"
    volumes:
      - ./.data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    container_name: smart-campus-redis
    image: docker.m.daocloud.io/library/redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./.redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  neo4j:
    container_name: smart-campus-neo4j
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j-dev-password}"
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ./.neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "password=\"$${NEO4J_AUTH#*/}\"; cypher-shell -u neo4j -p \"$$password\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    profiles: ["deploy"]
    image: ${BACKEND_IMAGE:-crpi-awzm63dqn5ugddo8.cn-hangzhou.personal.cr.aliyuncs.com/lukezhang/appbackend}:${IMAGE_TAG:-latest}
    container_name: smart-campus-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smart-campus}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j-dev-password}
      AI_PYTHON_BASE_URL: ${AI_PYTHON_BASE_URL:-http://host.docker.internal:8081}
      FILE_BASE_URL: ${FILE_BASE_URL:-http://localhost}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads

  web:
    profiles: ["deploy"]
    image: ${WEB_IMAGE:-crpi-awzm63dqn5ugddo8.cn-hangzhou.personal.cr.aliyuncs.com/lukezhang/appweb}:${IMAGE_TAG:-latest}
    container_name: smart-campus-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
