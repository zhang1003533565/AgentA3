name: smart-campus

services:
  adminer:
    container_name: smart-campus-adminer
    image: docker.m.daocloud.io/library/adminer:latest
    restart: always
    ports:
      - 7070:8080

  mysql:
    container_name: smart-campus-mysql
    image: docker.m.daocloud.io/library/mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "smart-campus"
    ports:
      - "3306:3306"
    volumes:
      - ./.data:/var/lib/mysql

  redis:
    container_name: smart-campus-redis
    image: docker.m.daocloud.io/library/redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./.redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
