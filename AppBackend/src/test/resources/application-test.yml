spring:
  datasource:
    url: jdbc:h2:mem:app_context;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

jwt:
  secret: test-only-secret-that-is-long-enough-for-hmac-signing-2026
  expiration: 86400000

tencent:
  cos:
    secret-id: test-secret-id
    secret-key: test-secret-key
    region: ap-beijing

exam-paper:
  preview:
    root: ${java.io.tmpdir}/agent-a3-context-test-exam-preview
