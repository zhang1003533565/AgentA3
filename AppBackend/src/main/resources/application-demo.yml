# Local demo profile: embedded H2, no Docker / MySQL required.
# Redis still uses the local Windows service on 6379 when available.
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./.data/demo-h2;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

knowledge:
  graph:
    neo4j:
      enabled: false

jwt:
  secret: ${JWT_SECRET:dev-local-jwt-secret-change-before-production-2026}
  expiration: ${JWT_EXPIRATION_MS:86400000}
