    for x in range(0, w, 3):\n        r, g, b = pixels[x, y]\n        if r > 140 and g < 120 and b < 120 and r - g > 40 and r - b > 40:\n            cnt += 1\n    rows.append((y, cnt))\n# 打印红色密集的行段\nprinting = False\nfor y, cnt in rows:\n    if cnt >= 5 and not printing:\n        print('red start y=', y); printing = True\n    elif cnt < 5 and printing:\n        print('red end y=', y-1); printing = False\n'@\n$code | Out-File -Encoding utf8 \"$env:TEMP\\red2.py\"\npython \"$env:TEMP\\red2.py\"", "Bash=$env:PYTHONIOENCODING='utf-8'\n$code = @'\nimport pymysql\nconn = pymysql.connect(host='localhost', port=3306, user='root', password='123456', database='smart-campus', charset='utf8mb4')\ntry:\n    with conn.cursor() as cur:\n        cur.execute(\"SELECT id, reporter_id, target_id, target_type, reason_type, reason_text, description, status, create_time FROM forum_report ORDER BY id\")\n        for r in cur.fetchall():\n            print(r)\n        print()\n        print('== 帖子标题 ==')\n        cur.execute(\"SELECT id, user_id, title FROM forum_post WHERE id IN (10,5,12)\")\n        for r in cur.fetchall():\n            print(r)\n        print()\n        print('== 用户 ==')\n        cur.execute(\"SELECT id, username, real_name FROM sys_user WHERE id IN (102,103)\")\n        for r in cur.fetchall():\n            print(r)\nfinally:\n    conn.close()\n'@\n$code | Out-File -Encoding utf8 \"$env:TEMP\\reports2.py\"\npython \"$env:TEMP\\reports2.py\"", "Bash=$code = @'\nAdd-Type -AssemblyName System.Runtime.WindowsRuntime\n$null = [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType=WindowsRuntime]\n$null = [Windows.Graphics.Imaging.BitmapDecoder, Windows.Foundation, ContentType=WindowsRuntime]\n$null = [Windows.Storage.StorageFile, Windows.Foundation, ContentType=WindowsRuntime]\n\nfunction Await($WinRtTask, $ResultType) {\n    $asTask = ([System.WindowsRuntimeSystemExtensions].GetMethods() | Where-Object { $_.Name -eq 'AsTask' -and $_.GetParameters().Count -eq 1 -and 