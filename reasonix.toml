tensions].GetMethods() | Where-Object { $_.Name -eq 'AsTask' -and $_.GetParameters().Count -eq 1 -and $_.GetParameters()[0].ParameterType.Name -eq 'IAsyncOperation`1' })[0]\n    $asTaskGeneric = $asTask.MakeGenericMethod($ResultType)\n    $netTask = $asTaskGeneric.Invoke($null, @($WinRtTask))\n    $netTask.Wait(-1) | Out-Null\n    $netTask.Result\n}\n$path = 'D:\\wyhsy\\github\\AgentA3\\.reasonix\\attachments\\clipboard-20260812-175753.804724-000003.png'\n$file = Await ([Windows.Storage.StorageFile]::GetFileFromPathAsync($path)) ([Windows.Storage.StorageFile])\n$stream = Await ($file.OpenAsync([Windows.Storage.FileAccessMode]::Read)) ([Windows.Storage.Streams.IRandomAccessStream])\n$decoder = Await ([Windows.Graphics.Imaging.BitmapDecoder]::CreateAsync($stream)) ([Windows.Graphics.Imaging.BitmapDecoder])\n$bitmap = Await ($decoder.GetSoftwareBitmapAsync()) ([Windows.Graphics.Imaging.SoftwareBitmap])\n$engine = [Windows.Media.Ocr.OcrEngine]::TryCreateFromUserProfileLanguages()\n$result = Await ($engine.RecognizeAsync($bitmap)) ([Windows.Media.Ocr.OcrResult])\nforeach ($line in $result.Lines) {\n    $r = $line.Words | ForEach-Object { $_.BoundingRect }\n    $x0 = ($r | Measure-Object -Property X -Minimum).Minimum\n    $y0 = ($r | Measure-Object -Property Y -Minimum).Minimum\n    $x1 = ($r | Measure-Object -Property X -Maximum).Maximum\n    $y1 = ($r | Measure-Object -Property Y -Maximum).Maximum\n    Write-Output ('y=' + [int]$y0 + ' x=' + [int]$x0 + ' [' + [int]$x1 + ',' + [int]$y1 + '] ' + $line.Text)\n}\n'@\n$code | Out-File -Encoding utf8 .reasonix/tmp_ocr_boxes.ps1\npowershell -NoProfile -ExecutionPolicy Bypass -File .reasonix/tmp_ocr_boxes.ps1", "Bash=$env:PYTHONIOENCODING='utf-8'\n$py = @'\nfrom PIL import Image\nimport sys\nsys.stdout.reconfigure(encoding='utf-8', errors='replace')\nim = Image.open(r'D:\\wyhsy\\github\\AgentA3\\.reasonix\\attachments\\clipboard-20260812-175753.804724-000003.png').convert('RGB')\nw, h = im.size\npx = im.load()\n# 内容区从 x=230 开始(左侧 sidebar 约占 0-220)\ndef row_white_ratio(y, x0=230, x1=1470):\n    white = 0; total = 0\n    for x in range(x0, x1, 4):\n        r, g, b = px[x, y]\n        total += 1\n        if r > 248 and g > 248 and b > 248:\n            white += 1\n    return white / total if total else 0\n# 检测白色卡片行区间(连续白色比例>0.7)\nruns = []\nin_run = False\nstart = 0\nfor y in range(40, h, 2):\n    ratio = row_white_ratio(y)\n    if ratio > 0.7 and not in_run:\n        in_run = True; start = y\n    elif ratio <= 0.7 and in_run:\n        in_run = False\n        if y - start > 30:\n            runs.append((start, y))\nif in_run:\n    runs.append((start, h))\nprint('white card row ranges (y):')\nfor s, e in runs:\n    print('  y', s, '-', e, ' height', e - s)\n'@\n$py | Out-File -Encoding utf8 .reasonix/tmp_blocks.py\npython .reasonix/tmp_blocks.py", "Bash=$env:PYTHONIOENCODING='utf-8'\n$py = @'\nfrom PIL import Image\nimport sys\nsys.stdout.reconfigure(encoding='utf-8', errors='replace')\nim = Image.open(r'D:\\wyhsy\\github\\AgentA3\\.reasonix\\attachments\\clipboard-20260812-175753.804724-000003.png').convert('RGB')\nw, h = im.size\npx = im.load()\n# 采样若干点的颜色,找出背景色\nsamples = [(240,60),(240,120),(240,180),(240,240),(240,300),(240,500),(240,560),(300,250),(1300,250),(240,400)]\nfor x, y in samples:\n    print((x,y), px[x,y])\n'@\n$py | Out-File -Encoding utf8 .reasonix/tmp_bg.py\npython .reasonix/tmp_bg.py", "Bash=$env:PYTHONIOENCODING='utf-8'\n$py = @'\nfrom PIL import Image\nfrom collections import Counter\nimport sys\nsys.stdout.reconfigure(encoding='utf-8', errors='replace')\nim = Image.open(r'D:\\wyhsy\\github\\AgentA3\\.reasonix\\attachments\\clipboard-20260812-175753.804724-000003.png').convert('RGB')\nw, h = im.size\npx = im.load()\ndef dominant(y):\n    c = Counter()\n    for x in range(240, 1470, 6):\n        r, g, b = px[x, y]\n        c[(r//16*16, g//16*16, b//16*16)] += 1\n    return c.most_common(1)[0]\n# 每 20px 输出主色\nprev = None\nfor y in range(50, h, 20):\n    col, cnt = dominan