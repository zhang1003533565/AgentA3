de]::Read)) ([Windows.Storage.Streams.IRandomAccessStream])\n    $decoder = Await ([Windows.Graphics.Imaging.BitmapDecoder]::CreateAsync($stream)) ([Windows.Graphics.Imaging.BitmapDecoder])\n    $bitmap = Await ($decoder.GetSoftwareBitmapAsync()) ([Windows.Graphics.Imaging.SoftwareBitmap])\n    $engine = [Windows.Media.Ocr.OcrEngine]::TryCreateFromUserProfileLanguages()\n    $result = Await ($engine.RecognizeAsync($bitmap)) ([Windows.Media.Ocr.OcrResult])\n    foreach ($line in $result.Lines) { Write-Output $line.Text }\n}\n'@\n$code | Out-File -Encoding utf8 \"$env:TEMP\\ocr16.ps1\"\npowershell -NoProfile -ExecutionPolicy Bypass -File \"$env:TEMP\\ocr16.ps1\"", "Bash=$env:PYTHONIOENCODING='utf-8'\n$py = @\"\nimport re\npath = r'D:\\wyhsy\\github\\AgentA3\\mini_program_app\\subpackage_message\\messageCenter\\messageCenter.vue'\ncontent = open(path, encoding='utf-8').read()\nm = re.search(r'<script>(.*?)</script>', content, re.S)\nopen(r'D:\\wyhsy\\github\\AgentA3\\mini_program_app\\.check_mc2.js', 'w', encoding='utf-8').write(m.group(1))\ntpl = re.search(r'<template>(.*?)</template>', content, re.S).group(1)\nmethods = set(re.findall(r'@click(?:\\.\\w+)?=\\\"([A-Za-z]+)', tpl))\nmissing = [x for x in methods if ('  ' + x + '(') not in m.group(1) and ('\\t' + x + '(') not in m.group(1)]\nprint('click methods:', sorted(methods))\nprint('missing:', missing)\n# 标签配对\nfor tag in ['view','text','image','nav-bar']:\n    opens = len(re.findall(r'<' + tag + r'[\\s>]', tpl))\n    closes = len(re.findall(r'</' + tag + r'>', tpl))\n    selfc = len(re.findall(r'<' + tag + r'[^>]*/>', tpl))\n    if opens != closes + selfc:\n        print('IMBALANCE', tag, opens, closes, selfc)\nprint('template ok')\n\"@\n$py | Out-File -Encoding utf8 \"$env:TEMP\\extract_mc2.py\"\npython \"$env:TEMP\\extract_mc2.py\"\nnode --check 'D:\\wyhsy\\github\\AgentA3\\mini_program_app\\.check_mc2.js'; if ($?) { 'messageCenter JS OK' }\nRemove-Item 'D:\\wyhsy\\github\\AgentA3\\mini_program_app\\.check_mc2.js' -ErrorAction SilentlyContinue", "Bash=$body = @{ username = 'student'; password = 'student123' } | ConvertTo-Json\n$login = Invoke-RestMethod -Uri 'http://localhost:8080/api/auth/applogin' -Method POST -Body $body -ContentType 'application/json' -TimeoutSec 15\n$headers = @{ Authorization = \"Bearer $($login.data.token)\" }\n# 模拟 loadForumMessages 统计逻辑\n$posts = Invoke-RestMethod -Uri 'http://localhost:8080/api/forum/posts?userId=103&pageNum=1&pageSize=20' -Method GET -Headers $headers -TimeoutSec 15\n$likeCount = ($posts.data.records | Where-Object { $_.likeCount -gt 0 }).Count\n$commentCount = 0\nforeach ($p in $posts.data.records) {\n  $cmts = Invoke-RestMethod -Uri \"http://localhost:8080/api/forum/comments?postId=$($p.id)&pageNum=1&pageSize=20\" -Method GET -Headers $headers -TimeoutSec 15\n  $commentCount += ($cmts.data.records | Where-Object { \"$($_.userId)\" -ne '103' }).Count\n}\n$topics = Invoke-RestMethod -Uri 'http://localhost:8080/api/forum/topics/3/posts?pageNum=1&pageSize=20' -Method GET -Headers $headers -TimeoutSec 15\n$systemCount = $topics.data.records.Count\nWrite-Output ('点赞: ' + $likeCount + ' | 评论: ' + $commentCount + ' | 系统: ' + $systemCount)", "Bash=$body = @{ username = 'student'; password = 'student123' } | ConvertTo-Json\n$login = Invoke-RestMethod -Uri 'http://localhost:8080/api/auth/applogin' -Method POST -Body $body -ContentType 'application/json' -TimeoutSec 15\n$headers = @{ Authorization = \"Bearer $($login.data.token)\" }\nforeach ($pid in 1,2,3,4,5,6) {\n  try {\n    $cmts = Invoke-RestMethod -Uri \"http://localhost:8080/api/forum/comments?postId=$pid&pageNum=1&pageSize=20\" -Method GET -Headers $headers -TimeoutSec 15\n    $recs = $cmts.data.records\n    $others = @($recs | Where-Object { \"$($_.userId)\" -ne '103' })\n    Write-Output (\"post $pid total=\" + $recs.Count + \" others=\" + $others.Count + \" otherIds=\" + (($others | ForEach-Object { $_.userId }) -join ','))\n  } catch { Write-Output (\"post $pid ERR: \" + $_.Exception.Message) }\n}", "Bash=$body = @{ username = 'student'; password = 'student123' } | ConvertTo-Json\n$login = Invoke-RestMethod -Uri 'http://localhost:8080/api/auth/applogin' -Method POST -Body $body -ContentType 'application/json' -TimeoutSec 15\n$headers = @{ Authorization = \"Bearer $($login.data.token)\" }\nforeach ($postId in 1,2,3,4,5,6) {\n  try {\n    $cmts = Invoke-RestMethod -Uri \"http://localhost:8080/api/forum/comments?postId=$postId&pageNum=1&pageSize=20\" -Method GET -Headers $headers -TimeoutSec 15\n    $recs = $cmts.data.records\n    $others = @($recs | Where-Object { \"$($_.userId)\" -ne '103' })\n    Write-Output (\"post $postId total=\" + $recs.Count + \" others=\" + $others.Count + \" otherIds=\" + (($others | ForEach-Object { $_.userId }) -join ','))\n  } catch { Write-Output (\"post $postId ERR: \" + $_.Exception.Message) }\n}", "Bash=$env:PYTHONIOENCODING='utf-8'\n$code = @'\nimport requests, json\nbase = 'http://localhost:8080'\nlogin = requests.post(base + '/api/auth/applogin', json={'username':'student','password':'student123'}, timeout=15)\ntoken = login.json()['data']['token']\nheaders = {'Authorization': 'Bearer ' + token}\nuid = '103'\nposts = requests.get(base + '/api/forum/posts', params={'userId': uid, 'pageNum':1,'pageSize':20}, headers=headers, timeout=15).json()['data']['records']\nlikeCount = sum(1 for p in posts if (p.get('likeCount') or 0) > 0)\ncommentCount = 0\nfor p in posts:\n    cmts = requests.get(base + '/api/forum/comments', params={'postId': p['id'], 'pageNum':1,'pageSize':20}, headers=headers, timeout=15).json()['data']['records']\n    commentCount += sum(1 for c in cmts if str(c.get('userId')) != uid)\ntopics = requests.get(base + '/api/forum/topics/3/posts', params={'pageNum':1,'pageSize':20}, headers=headers, timeout=15).json()['data']['records']\nsystemCount = len(topics)\nprint('likeCount =', likeCount)\nprint('commentCount =', commentCount)\nprint('systemCount =', systemCount)\n'@\n$code | Out-File -Encoding utf8 \"$env:TEMP\\verify_forum_msgs.py\"\npython \"$env:TEMP\\verify_forum_msgs.py\"", "Bash=$env:PYTHONIOENCODING='utf-8'\n$code = @'\nimport json, urllib.request\nbase = 'http://localhost:8080'\n\ndef api(path, headers=None, params=None):\n    url = base + path\n    if params:\n        qs = '&'.join(f'{k}={v}' for k, v in params.items())\n        url += '?' + qs\n    req = urllib.request.Request(url, headers=headers or {})\n    with urllib.request.urlopen(req, timeout=15) as resp:\n        return json.loads(resp.read().decode('utf-8'))\n\nlogin = api('/api/auth/applogin', headers={'Content-Type':'application/json'}, params=None)\n# 需要 POST body\nreq = urllib.request.Request(base + '/api/auth/applogin', data=json.dumps({'username':'student','password':'student123'}).encode(), headers={'Content-Type':'application/json'})\nwith urllib.request.urlopen(req, timeout=15) as resp:\n    login = json.loads(resp.read().decode('utf-8'))\ntoken = login['data']['token']\nheaders = {'Authorization': 'Bearer ' + token}\n\ndata = api('/api/forum/posts', headers=headers, params={'userId':'103','pageNum':'1','pageSize':'20'})\nposts = data['data']['records']\nlikeCount = sum(1 for p in posts if (p.get('likeCount') or 0) > 0)\ncommentCount = 0\nfor p in posts:\n    cmts = api('/api/forum/comments', headers=headers, params={'postId': str(p['id']), 'pageNum':'1','pageSize':'20'})\n    commentCount += sum(1 for c in cmts['data']['records'] if str(c.get('userId')) != '103')\ntopics = api('/api/forum/topics/3/posts', headers=headers, params={'pageNum':'1','pageSize':'20'})\nsystemCount = len(topics['data']['records'])\nprint('likeCount =', likeCount)\nprint('commentCount =', commentCount)\nprint('systemCount =', systemCount)\n'@\n$code | Out-File -Encoding utf8 \"$env:TEMP\\verify_forum2.py\"\npython \"$env:TEMP\\verify_forum2.py\"", "Bash=$code = @'\nAdd-Type -AssemblyName System.Runtime.WindowsRuntime\n$null = [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType=WindowsRuntime]\n$null = [Windows.Graphics.Imaging.BitmapDecoder, Windows.Foundation, ContentType=WindowsRuntime]\n$null = [Windows.Storage.StorageFile, Windows.Foundation, ContentType=WindowsRuntime]\n\nfunction Await($WinRtTask, $ResultType) {\n    $asTask = ([System.WindowsRuntimeSystemExtensions].GetMethods() | Where-Object { $_.Name -eq 'AsTask' -and $_.GetParameters().Count -eq 1 -and $_.GetParameters()[0].ParameterType.Name -eq 'IAsyncOperation`1' })[0]\n    $asTaskGeneric = $asTask.MakeGenericMethod($ResultType)\n    $netTask = $asTaskGeneric.Invoke($null, @($WinRtTask))\n    $netTask.Wait(-1) | Out-Null\n    $netTask.Result\n}\n\n$path = 'D:\\wyhsy\\github\\AgentA3\\.reasonix\\attachments\\clipboard-20260808-191756.214985-000003.png'\n$file = Await ([Windows.Storage.StorageFile]::GetFileFromPathAsync($path)) ([Windows.Storage.StorageFile])\n$stream = Await ($file.OpenAsync([Windows.Storage.FileAccessMode]::Read)) ([Windows.Storage.Streams.IRandomAccessStream])\n$decoder = Await ([Windows.Graphics.Imaging.BitmapDecoder]::CreateAsync($stream)) ([Windows.Graphics.Imaging.BitmapDecoder])\n$bitmap = Await ($decoder.GetSoftwareBitmapAsync()) ([Windows.Graphics.Imaging.SoftwareBitmap])\n$engine = [Windows.Media.Ocr.OcrEngine]::TryCreateFromUserProfileLanguages()\n$result = Await ($engine.RecognizeAsync($bitmap)) ([Windows.Media.Ocr.OcrResult])\nforeach ($line in $result.Lines) { Write-Output $line.Text }\n'@\n$code | Out-File -Encoding utf8 \"$env:TEMP\\ocr17.ps1\"\npowershell -NoProfile -ExecutionPolicy Bypass -File \"$env:TEMP\\ocr17.ps1\"", "Bash=$env:PYTHONIOENCODING='utf-8'\n$py = @\"\nimport re\nfor name, path in [('messageCategory', r'D:\\wyhsy\\github\\AgentA3\\mini_program_app\\subpackage_message\\messageCategory\\messageCategory.vue'),\n                   ('messageList', r'D:\\wyhsy\\github\\AgentA3\\mini_program_app\\subpackage_message\\messageList\\messageList.vue')]:\n    content = open(path, encoding='utf-8').read()\n    m = re.search(r'<script>(.*?)</script>