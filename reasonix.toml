:PYTHONIOENCODING='utf-8'\n$py = @'\nimport pymysql, sys\nsys.stdout.reconfigure(encoding='utf-8', errors='replace')\nconn = pymysql.connect(host='localhost', port=3306, user='root', password='123456', database='smart-campus', charset='utf8mb4')\ntry:\n    with conn.cursor() as cur:\n        cur.execute(\"SELECT id, title, status, pin_order FROM forum_post ORDER BY id\")\n        print('forum_post:')\n        for r in cur.fetchall():\n            print(' ', r)\nfinally:\n    conn.close()\n'@\n$py | Out-File -Encoding utf8 .reasonix/tmp_status.py\npython .reasonix/tmp_status.py\nRemove-Item .reasonix/tmp_status.py -ErrorAction SilentlyContinue", "Bash=$loginBody = @{ username = 'student'; password = 'student123' } | ConvertTo-Json\n$login = Invoke-RestMethod -Uri 'http://localhost:8080/api/auth/applogin' -Method POST -Body $loginBody -ContentType 'application/json' -TimeoutSec 15\n$headers = @{ Authorization = \"Bearer $($login.data.token)\" }\nWrite-Output ('login code=' + $login.code)\n# APP 端列表接口(模拟 forumList 调用: 不传 status)\n$list = Invoke-RestMethod -Uri 'http://localhost:8080/api/forum/posts?pageNum=1&pageSize=50' -Method GET -Headers $headers -TimeoutSec 15\nWrite-Output ('list code=' + $list.code + ' total=' + $list.data.total + ' returned=' + $list.data.records.Count)\nforeach ($r in $list.data.records) { Write-Output ('  id=' + $r.id + ' title=' + $r.title + ' status=' + $r.status) }\n# 热门接口\n$hot = Invoke-RestMethod -Uri 'http://localhost:8080/api/forum/posts/hot?pageNum=1&pageSize=10' -Method GET -Headers $headers -TimeoutSec 15\nWrite-Output ('hot total=' + $hot.data.total)\nforeach ($r in $hot.data.records) { Write-Output ('  hot id=' + $r.id + ' status=' + $r.status) }", "Bash=$env:PYTHONIOENCODING='utf-8'\n$py = @'\nimport pymysql, sys\nsys.stdout.reconfigure(encoding='utf-8', errors='replace')\nconn = pymysql.connect(host='localhost', port=3306, user='root', password='123456', database='smart-campus', charset='utf8mb4')\ntry:\n    with conn.cursor() a