oding utf8 \"$env:TEMP\\verify_forum_msgs.py\"\npython \"$env:TEMP\\verify_forum_msgs.py\"", "Bash=$env:PYTHONIOENCODING='utf-8'\n$code = @'\nimport json, urllib.request\nbase = 'http://localhost:8080'\n\ndef api(path, headers=None, params=None):\n    url = base + path\n    if params:\n        qs = '&'.join(f'{k}={v}' for k, v in params.items())\n        url += '?' + qs\n    req = urllib.request.Request(url, headers=headers or {})\n    with urllib.request.urlopen(req, timeout=15) as resp:\n        return json.loads(resp.read().decode('utf-8'))\n\nlogin = api('/api/auth/applogin', headers={'Content-Type':'application/json'}, params=None)\n# 需要 POST body\nreq = urllib.request.Request(base + '/api/auth/applogin', data=json.dumps({'username':'student','password':'student123'}).encode(), headers={'Content-Type':'application/json'})\nwith urllib.request.urlopen(req, timeout=15) as resp:\n    login = json.loads(resp.read().decode('utf-8'))\ntoken = login['data']['token']\nheaders = {'Authorization': 'Bearer ' + token}\n\ndata = api('/api/forum/posts', headers=headers, params={'userId':'103','pageNum':'1','pageSize':'20'})\nposts = data['data']['records']\nlikeCount = sum(1 for p in posts if (p.get('likeCount') or 0) > 0)\ncommentCount = 0\nfor p in posts:\n    cmts = api('/api/forum/comments', headers=headers, params={'postId': str(p['id']), 'pageNum':'1','pageSize':'20'})\n    commentCount += sum(1 for c in cmts['data']['records'] if str(c.get('userId')) != '103')\ntopics = api('/api/forum/topics/3/posts', headers=headers, params={'pageNum':'1','pageSize':'20'})\nsystemCount = len(topics['data']['records'])\nprint('likeCount =', likeCount)\nprint('commentCount =', commentCount)\nprint('systemCount =', systemCount)\n'@\n$code | Out-File -Encoding utf8 \"$env:TEMP\\verify_forum2.py\"\npython \"$env:TEMP\\verify_forum2.py\"", "Bash=$code = @'\nAdd-Type -AssemblyName System.Runtime.WindowsRuntime\n$null = [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType=WindowsRu