nBASE = 'http://localhost:8080'\n\ndef call(method, path, data=None, token=None, params=None):\n    url = BASE + path\n    if params:\n        url += '?' + urllib.parse.urlencode(params)\n    req = urllib.request.Request(url, method=method)\n    if data is not None:\n        req.add_header('Content-Type', 'application/json')\n        req.data = json.dumps(data).encode('utf-8')\n    if token:\n        req.add_header('Authorization', 'Bearer ' + token)\n    try:\n        with urllib.request.urlopen(req, timeout=10) as resp:\n            return json.loads(resp.read().decode('utf-8'))\n    except Exception as e:\n        body = ''\n        try:\n            body = e.read().decode('utf-8')\n        except Exception:\n            pass\n        return {'error': str(e), 'body': body}\n\n# 登录 teacher\nr = call('POST', '/api/auth/applogin', {'username': 'teacher', 'password': 'teacher123'})\nprint('LOGIN teacher:', json.dumps(r, ensure_ascii=False)[:200])\ntoken_t = (r.get('data') or {}).get('token') or ''\n'@\n$code | Out-File -Encoding utf8 \"$env:TEMP\\login2.py\"\npython \"$env:TEMP\\login2.py\"", "Bash=$env:PYTHONIOENCODING='utf-8'\n$code = @'\nimport json, urllib.request, urllib.parse\n\nBASE = 'http://localhost:8080'\n\ndef call(method, path, data=None, token=None, params=None):\n    url = BASE + path\n    if params:\n        url += '?' + urllib.parse.urlencode(params)\n    req = urllib.request.Request(url, method=method)\n    if data is not None:\n        req.add_header('Content-Type', 'application/json')\n        req.data = json.dumps(data).encode('utf-8')\n    if token:\n        req.add_header('Authorization', 'Bearer ' + token)\n    try:\n        with urllib.request.urlopen(req, timeout=10) as resp:\n            return json.loads(resp.read().decode('utf-8'))\n    except Exception as e:\n        body = ''\n        try:\n            body = e.read().decode('utf-8')\n        except Exception:\n            pass\n        return {'error': str(e), 'body': body}\n\ndef logi