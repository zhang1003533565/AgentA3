b2.py -ErrorAction SilentlyContinue", "Bash=Write-Output '--- ForumPostRepository findPosts/findHotPosts/findUserPosts ---'\nGet-Content 'AppBackend/src/main/java/com/example/appbackend/repository/ForumPostRepository.java' | Select-Object -First 50\nWrite-Output '--- TopicServiceImpl.getHotTopics ---'\nSelect-String -Path 'AppBackend/src/main/java/com/example/appbackend/service/impl/TopicServiceImpl.java' -Pattern 'getHotTopics|findByStatusOrderByPostCountDesc|findHot' -Context 0,6 | ForEach-Object { $_.Line.Trim(); $_.Context.PostContext | ForEach-Object { $_.Trim() } }", "Bash=cd AppBackend; mvn -q compile 2>&1 | Select-Object -Last 8; Write-Output ('compile exit=' + $LASTEXITCODE)", "Bash=# 重启后端:杀掉当前 8080,重新启动\n$conn = Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1\nif ($conn) { Stop-Process -Id $conn.OwningProcess -Force -ErrorAction SilentlyContinue; Write-Output ('killed ' + $conn.OwningProcess) }\nStart-Sleep -Seconds 3\n$conn2 = Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1\nif ($conn2) { Write-Output 'still listening' } else { Write-Output 'released' }", "Bash=$conn = Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1\n$pid8080 = $conn.OwningProcess\nWrite-Output ('8080 pid=' + $pid8080)\n# 强制杀(可能上一轮的 kill 没生效)\nStop-Process -Id $pid8080 -Force -ErrorAction SilentlyContinue\nStart-Sleep -Seconds 4\n$conn2 = Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1\nif ($conn2) { Write-Output ('STILL pid=' + $conn2.OwningProcess) } else { Write-Output 'released' }", "Bash=$ok = $false\nfor ($i = 0; $i -lt 15; $i++) {\n  Start-Sleep -Seconds 8\n  $conn = Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1\n  if ($conn) { Write-Output ('8080 UP after ~' + (($i+1)*8) + 's'); $ok = $true; br